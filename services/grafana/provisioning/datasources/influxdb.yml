# Datasource de InfluxDB (Flux) aprovisionado para Grafana.
# Usa el token de SOLO LECTURA generado por influx-tokens-init (volumen mcp-secrets),
# nunca el token admin. Grafana lo lee del fichero compartido al arrancar.
apiVersion: 1

datasources:
  - name: InfluxDB
    uid: aeroadd-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUXDB_INIT_ORG}
      defaultBucket: ${INFLUXDB_INIT_BUCKET}
      tlsSkipVerify: true
    secureJsonData:
      token: $__file{/shared/influx-grafana-token}
