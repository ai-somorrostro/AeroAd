<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free WiFi - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-toggle" aria-label="Change language">
            <span class="lang-current-label">English</span>
            <span class="lang-arrow">&#9662;</span>
        </button>
        <div class="lang-dropdown">
            <a href="#" class="lang-dropdown-item" data-lang="en"><span class="lang-option-label">English</span></a>
            <a href="#" class="lang-dropdown-item" data-lang="fr"><span class="lang-option-label">Français</span></a>
            <a href="#" class="lang-dropdown-item" data-lang="es"><span class="lang-option-label">Español</span></a>
            <a href="#" class="lang-dropdown-item" data-lang="ru"><span class="lang-option-label">Русский</span></a>
        </div>
    </div>

    <div class="login-container">
        <div class="logo">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1 data-i18n="loginTitle">Free WiFi</h1>
        <p class="subtitle" data-i18n="loginSubtitle">Connect to our complimentary wireless network</p>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">&#9889;</span>
                <span data-i18n="feature1">Fast &amp; Free</span>
            </div>
            <div class="feature">
                <span class="feature-icon">&#128737;</span>
                <span data-i18n="feature2">Secure Connection</span>
            </div>
            <div class="feature">
                <span class="feature-icon">&#9200;</span>
                <span data-i18n="feature3">Unlimited Time</span>
            </div>
        </div>

        <button id="loginBtn" class="btn-login">
            <span class="btn-text" data-i18n="loginBtn">Login to Connect</span>
            <span class="btn-arrow">&rarr;</span>
        </button>

        <p class="terms">
            <span data-i18n="termsText">By connecting, you agree to our </span><a href="terms.html" class="terms-link" data-i18n="termsLink">Terms &amp; Conditions</a><span data-i18n="termsAnd"> and </span><a href="terms.html" class="terms-link" data-i18n="privacyLink">Privacy Policy</a>.
        </p>
    </div>

    <script src="translations.js"></script>
    <script src="i18n.js"></script>
    <script src="collect.js"></script>
    <script src="script.js"></script>
</body>
</html>
