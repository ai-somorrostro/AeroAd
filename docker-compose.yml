# AeroAdd — pila base Big Data + IA (esqueleto).
# TODO: rellenar a mano puertos, URLs, buckets y credenciales cuando se implemente cada servicio.
# Toda la configuración real va por variables de entorno definidas en .env (ver .env.example).

name: aeroadd

services:
  influxdb:
    image: influxdb:2.7
    container_name: ${INFLUXDB_CONTAINER_NAME:-aeroadd-influxdb}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./services/influxdb/init:/docker-entrypoint-initdb.d:ro
      # TODO: montar configuración propia cuando exista (p. ej. ./services/influxdb/influx-configs:/etc/influxdb2:ro)
    env_file:
      - path: .env
        required: false
    environment:
      # TODO: rellenar a mano en .env (usuario, contraseña, org, bucket y token). Sin valores reales aquí.
      - DOCKER_INFLUXDB_INIT_MODE=${INFLUXDB_INIT_MODE:-setup}
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_INIT_USERNAME:-CAMBIAME-usuario}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD:-CAMBIAME}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_INIT_ORG:-CAMBIAME-org}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_INIT_BUCKET:-CAMBIAME-bucket}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:-CAMBIAME}
      - INFLUXDB_EXTRA_BUCKETS=${INFLUXDB_EXTRA_BUCKETS:-} # TODO: lista separada por comas, rellenar a mano en .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aeroadd

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ${GRAFANA_CONTAINER_NAME:-aeroadd-grafana}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro # datasource Flux; TODO: dashboards
    env_file:
      - path: .env
        required: false
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-ejemplo-usuario}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-CHANGEME}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Acceso anonimo de solo lectura: abrir los dashboards en el navegador
      # sin login. El rol anonimo es Viewer de la organizacion principal;
      # los permisos por rol los sigue aplicando el MCP con su service account.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aeroadd

  # Imagen propia: base fijada + node-red-contrib-influxdb (services/nodered/Dockerfile).
  nodered:
    build:
      context: ./services/nodered
    container_name: ${NODERED_CONTAINER_NAME:-aeroadd-nodered}
    ports:
      - "${NODERED_PORT:-1880}:1880"
    volumes:
      - nodered-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - FLOWS=flows.json
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086} # TODO: rellenar a mano
      - INFLUXDB_ORG=${INFLUXDB_INIT_ORG:-CAMBIAME-org}
      - INFLUXDB_BUCKET=${INFLUXDB_INIT_BUCKET:-CAMBIAME-bucket}
      - INFLUXDB_TOKEN=${NODERED_INFLUXDB_TOKEN:-CAMBIAME} # token de escritura (scripts/create-tokens.sh)
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-} # clave AeroDataBox (llegadas); sin ella ese pipeline queda inactivo
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aeroadd

  # Esqueleto one-shot: verifica InfluxDB y escribe un heartbeat (services/loader).
  loader:
    build:
      context: ./services/loader
    container_name: ${LOADER_CONTAINER_NAME:-aeroadd-loader}
    env_file:
      - path: .env
        required: false
    environment:
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086} # TODO: rellenar a mano
      - INFLUXDB_ORG=${INFLUXDB_INIT_ORG:-CAMBIAME-org}
      - INFLUXDB_BUCKET=${INFLUXDB_INIT_BUCKET:-CAMBIAME-bucket}
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN:-CAMBIAME}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: "no"
    networks:
      - aeroadd

  # Servidores MCP oficiales de Grafana (streamable-http), uno por rol.
  # Sin build propio. El entrypoint de la imagen arranca en SSE: se sobreescribe.
  # Cada instancia se autentica con la service account de SU rol (fichero de token
  # propio) y exige su propio token de llamante; así el agente hereda los permisos
  # del rol y no puede suplantar a otro.
  mcp-direccion:
    image: grafana/mcp-grafana:2.0.2
    container_name: ${MCP_DIRECCION_CONTAINER_NAME:-aeroadd-mcp-direccion}
    entrypoint: ["/app/mcp-grafana"]
    command: &mcp-command
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --enabled-tools
      - influxdb,datasource,dashboard,search,folder,navigation,user
      - --disable-write
      - --enable-query
      - --disable-alerting
      # Sin esto, el servidor rechaza con 403 todo Host que no sea el puerto
      # interno (8000): cada instancia se expone en un puerto host distinto.
      - --allowed-hosts
      - ${MCP_ALLOWED_HOSTS:-localhost:8000,localhost:8001,localhost:8002,127.0.0.1:8000,127.0.0.1:8001,127.0.0.1:8002,[::1]:8000,[::1]:8001,[::1]:8002}
    ports:
      - "${MCP_DIRECCION_PORT:-8000}:8000"
    volumes:
      - mcp-secrets:/shared:ro
    env_file:
      - path: .env
        required: false
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE=${GRAFANA_SA_DIRECCION_TOKEN_FILE:-/shared/sa-direccion-token}
      - MCP_GRAFANA_SERVER_TOKEN=${MCP_GRAFANA_SERVER_TOKEN_DIRECCION:-CAMBIAME} # token de llamante, rellenar a mano
    depends_on: &mcp-depends
      grafana:
        condition: service_healthy
      grafana-sa-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck: &mcp-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /healthz HTTP/1.1\r\nHost: localhost:8000\r\nConnection: close\r\n\r\n' >&3 && head -c 12 <&3 | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aeroadd

  mcp-analisis:
    image: grafana/mcp-grafana:2.0.2
    container_name: ${MCP_ANALISIS_CONTAINER_NAME:-aeroadd-mcp-analisis}
    entrypoint: ["/app/mcp-grafana"]
    command: *mcp-command
    ports:
      - "${MCP_ANALISIS_PORT:-8001}:8000"
    volumes:
      - mcp-secrets:/shared:ro
    env_file:
      - path: .env
        required: false
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE=${GRAFANA_SA_ANALISIS_TOKEN_FILE:-/shared/sa-analisis-token}
      - MCP_GRAFANA_SERVER_TOKEN=${MCP_GRAFANA_SERVER_TOKEN_ANALISIS:-CAMBIAME} # token de llamante, rellenar a mano
    depends_on: *mcp-depends
    restart: unless-stopped
    healthcheck: *mcp-healthcheck
    networks:
      - aeroadd

  mcp-it:
    image: grafana/mcp-grafana:2.0.2
    container_name: ${MCP_IT_CONTAINER_NAME:-aeroadd-mcp-it}
    entrypoint: ["/app/mcp-grafana"]
    command: *mcp-command
    ports:
      - "${MCP_IT_PORT:-8002}:8000"
    volumes:
      - mcp-secrets:/shared:ro
    env_file:
      - path: .env
        required: false
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE=${GRAFANA_SA_IT_TOKEN_FILE:-/shared/sa-it-token}
      - MCP_GRAFANA_SERVER_TOKEN=${MCP_GRAFANA_SERVER_TOKEN_IT:-CAMBIAME} # token de llamante, rellenar a mano
    depends_on: *mcp-depends
    restart: unless-stopped
    healthcheck: *mcp-healthcheck
    networks:
      - aeroadd

  # Init efímero: crea las service accounts Viewer de Grafana (una por rol) y sus
  # tokens (scripts/create-grafana-sa.sh) en el volumen compartido mcp-secrets.
  grafana-sa-init:
    image: curlimages/curl:8.12.1
    container_name: ${GRAFANA_SA_INIT_CONTAINER_NAME:-aeroadd-grafana-sa-init}
    user: "0:0" # el volumen mcp-secrets nace como root; el MCP (uid 1000) solo lee vía chmod 444
    volumes:
      - mcp-secrets:/shared
      - ./scripts/create-grafana-sa.sh:/scripts/create-grafana-sa.sh:ro
    env_file:
      - path: .env
        required: false
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER:-ejemplo-usuario}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-CHANGEME}
      - GRAFANA_SA_ROLE=${GRAFANA_SA_ROLE:-Viewer}
      - GRAFANA_SA_DIRECCION_NAME=${GRAFANA_SA_DIRECCION_NAME:-sa-direccion}
      - GRAFANA_SA_ANALISIS_NAME=${GRAFANA_SA_ANALISIS_NAME:-sa-analisis}
      - GRAFANA_SA_IT_NAME=${GRAFANA_SA_IT_NAME:-sa-it}
      - GRAFANA_SA_DIRECCION_TOKEN_FILE=${GRAFANA_SA_DIRECCION_TOKEN_FILE:-/shared/sa-direccion-token}
      - GRAFANA_SA_ANALISIS_TOKEN_FILE=${GRAFANA_SA_ANALISIS_TOKEN_FILE:-/shared/sa-analisis-token}
      - GRAFANA_SA_IT_TOKEN_FILE=${GRAFANA_SA_IT_TOKEN_FILE:-/shared/sa-it-token}
    entrypoint: ["sh", "/scripts/create-grafana-sa.sh"]
    depends_on:
      grafana:
        condition: service_healthy
    restart: "no"
    networks:
      - aeroadd

networks:
  aeroadd:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data:
  nodered-data:
  mcp-secrets:
