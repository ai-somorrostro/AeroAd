# AeroAdd — pila base Big Data + IA (esqueleto).
# TODO: rellenar a mano puertos, URLs, buckets y credenciales cuando se implemente cada servicio.
# Toda la configuración real va por variables de entorno definidas en .env (ver .env.example).

name: aeroadd

services:
  influxdb:
    image: influxdb:2.7
    container_name: ${INFLUXDB_CONTAINER_NAME:-aeroadd-influxdb}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./services/influxdb/init:/docker-entrypoint-initdb.d:ro
      # TODO: montar configuración propia cuando exista (p. ej. ./services/influxdb/influx-configs:/etc/influxdb2:ro)
    env_file:
      - path: .env
        required: false
    environment:
      # TODO: rellenar a mano en .env (usuario, contraseña, org, bucket y token). Sin valores reales aquí.
      - DOCKER_INFLUXDB_INIT_MODE=${INFLUXDB_INIT_MODE:-setup}
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_INIT_USERNAME:-CAMBIAME-usuario}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD:-CAMBIAME}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_INIT_ORG:-CAMBIAME-org}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_INIT_BUCKET:-CAMBIAME-bucket}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:-CAMBIAME}
      - INFLUXDB_EXTRA_BUCKETS=${INFLUXDB_EXTRA_BUCKETS:-} # TODO: lista separada por comas, rellenar a mano en .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aeroadd

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ${GRAFANA_CONTAINER_NAME:-aeroadd-grafana}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro # datasource Flux; TODO: dashboards
      - mcp-secrets:/shared:ro # token de lectura de InfluxDB (influx-tokens-init)
    env_file:
      - path: .env
        required: false
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-ejemplo-usuario}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-CHANGEME}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Acceso anonimo de solo lectura: abrir los dashboards en el navegador
      # sin login. El rol anonimo es Viewer de la organizacion principal;
      # los permisos por rol los sigue aplicando el MCP con su service account.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      influxdb:
        condition: service_healthy
      # El datasource aprovisionado lee el token InfluxDB desde un fichero del
      # volumen mcp-secrets: sin el init no arranca (provisioning con error).
      influx-tokens-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aeroadd

  # Imagen propia: base fijada + node-red-contrib-influxdb (services/nodered/Dockerfile).
  nodered:
    build:
      context: ./services/nodered
    container_name: ${NODERED_CONTAINER_NAME:-aeroadd-nodered}
    ports:
      - "${NODERED_PORT:-1880}:1880"
    volumes:
      - nodered-data:/data
      - mcp-secrets:/shared:ro # token de escritura de InfluxDB (influx-tokens-init)
    env_file:
      - path: .env
        required: false
    environment:
      - FLOWS=flows.json
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086} # TODO: rellenar a mano
      - INFLUXDB_ORG=${INFLUXDB_INIT_ORG:-CAMBIAME-org}
      - INFLUXDB_BUCKET=${INFLUXDB_INIT_BUCKET:-CAMBIAME-bucket}
      # Token de escritura: lo exporta el entrypoint propio de la imagen desde
      # /shared/influx-nodered-token (lo genera influx-tokens-init). Si no existe
      # el fichero, el contenedor arranca y el pipeline de InfluxDB fallará a la
      # vista en el log de Node-RED.
      - INFLUXDB_TOKEN_FILE=/shared/influx-nodered-token
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-} # clave AeroDataBox (llegadas); sin ella ese pipeline queda inactivo
    depends_on:
      influxdb:
        condition: service_healthy
      influx-tokens-init:
        condition: service_completed_successfully
    healthcheck:
      # wget con 127.0.0.1: en la imagen busybox de Node-RED 'localhost' resuelve a
      # ::1 y Node-RED solo escucha en IPv4.
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:1880/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - aeroadd

  # Esqueleto one-shot: carga el histórico de captaciones (CSV) y verifica InfluxDB
  # (services/loader). Si falta configuración real, avisa por log y sale con 0.
  loader:
    build:
      context: ./services/loader
    container_name: ${LOADER_CONTAINER_NAME:-aeroadd-loader}
    volumes:
      - ./BDA/ImporCsvPandas:/data:ro # CSV del histórico (captaciones_junio_2026.csv)
      - mcp-secrets:/shared:ro # token de escritura de InfluxDB (influx-tokens-init)
    env_file:
      - path: .env
        required: false
    environment:
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086} # TODO: rellenar a mano
      - INFLUXDB_ORG=${INFLUXDB_INIT_ORG:-CAMBIAME-org}
      # Bucket destino: el histórico de captaciones. Ajusta si cambias la
      # arquitectura (el token del loader solo tiene escritura aquí).
      - INFLUXDB_BUCKET=${LOADER_INFLUXDB_BUCKET:-captaciones_julio}
      # Token de mínimo privilegio: lo genera influx-tokens-init y se lee del
      # fichero (no va en .env). Fallback por .env si alguien prefiere manual.
      - INFLUXDB_TOKEN=${LOADER_INFLUXDB_TOKEN:-}
      - INFLUXDB_TOKEN_FILE=/shared/influx-loader-token
      - LOADER_CSV=${LOADER_CSV:-/data/captaciones_junio_2026.csv}
    depends_on:
      influxdb:
        condition: service_healthy
      influx-tokens-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - aeroadd

  # Servidor MCP oficial de Grafana (streamable-http), una sola instancia para
  # todos los clientes. Sin build propio. El entrypoint de la imagen arranca en
  # SSE: se sobreescribe. Se autentica con una única service account Viewer y
  # exige un token de llamante compartido; todos los clientes ven lo mismo.
  mcp-grafana:
    image: grafana/mcp-grafana:2.0.2
    container_name: ${MCP_GRAFANA_CONTAINER_NAME:-aeroadd-mcp-grafana}
    entrypoint: ["/app/mcp-grafana"]
    command:
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --enabled-tools
      - influxdb,datasource,dashboard,search,folder,navigation,user
      - --disable-write
      - --enable-query
      - --disable-alerting
      # El servidor valida el header Host; solo se publica el puerto 8000.
      - --allowed-hosts
      - ${MCP_ALLOWED_HOSTS:-localhost:8000,127.0.0.1:8000,[::1]:8000}
    ports:
      - "${MCP_GRAFANA_PORT:-8000}:8000"
    volumes:
      - mcp-secrets:/shared:ro
    env_file:
      - path: .env
        required: false
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE=${GRAFANA_SA_TOKEN_FILE:-/shared/sa-mcp-token}
      - MCP_GRAFANA_SERVER_TOKEN=${MCP_GRAFANA_SERVER_TOKEN:-CAMBIAME} # token de llamante compartido
    depends_on:
      grafana:
        condition: service_healthy
      grafana-sa-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /healthz HTTP/1.1\r\nHost: localhost:8000\r\nConnection: close\r\n\r\n' >&3 && head -c 12 <&3 | grep -q 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aeroadd

  # Init efímero: crea la service account Viewer del MCP y su token
  # (scripts/create-grafana-sa.sh) en el volumen compartido mcp-secrets,
  # donde también dejan los suyos influx-tokens-init y el propio provisioning.
  grafana-sa-init:
    image: curlimages/curl:8.12.1
    container_name: ${GRAFANA_SA_INIT_CONTAINER_NAME:-aeroadd-grafana-sa-init}
    user: "0:0" # el volumen mcp-secrets nace como root; el MCP (uid 1000) solo lee vía chmod 444
    volumes:
      - mcp-secrets:/shared
      - ./scripts/create-grafana-sa.sh:/scripts/create-grafana-sa.sh:ro
    env_file:
      - path: .env
        required: false
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER:-ejemplo-usuario}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-CHANGEME}
      - GRAFANA_SA_NAME=${GRAFANA_SA_NAME:-sa-mcp}
      - GRAFANA_SA_ROLE=${GRAFANA_SA_ROLE:-Viewer}
      - GRAFANA_SA_TOKEN_FILE=${GRAFANA_SA_TOKEN_FILE:-/shared/sa-mcp-token}
    entrypoint: ["sh", "/scripts/create-grafana-sa.sh"]
    depends_on:
      grafana:
        condition: service_healthy
    restart: "no"
    networks:
      - aeroadd

  # Init efímero: crea los tokens de InfluxDB de mínimo privilegio (uno por
  # servicio: grafana lee, nodered y loader escriben) y los deja como ficheros
  # en el volumen compartido mcp-secrets (scripts/create-influx-tokens.sh).
  # Idempotente y consciente de permisos: si cambia la lista de buckets,
  # borra los tokens obsoletos del servicio y crea unos nuevos.
  influx-tokens-init:
    image: influxdb:2.7
    container_name: ${INFLUX_TOKENS_INIT_CONTAINER_NAME:-aeroadd-influx-tokens-init}
    entrypoint: ["bash", "/scripts/create-influx-tokens.sh"]
    volumes:
      - mcp-secrets:/shared
      - ./scripts/create-influx-tokens.sh:/scripts/create-influx-tokens.sh:ro
    env_file:
      - path: .env
        required: false
    environment:
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086}
      - INFLUXDB_INIT_ORG=${INFLUXDB_INIT_ORG:-CAMBIAME-org}
      - INFLUXDB_INIT_BUCKET=${INFLUXDB_INIT_BUCKET:-CAMBIAME-bucket}
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:-CAMBIAME}
      - GRAFANA_READ_BUCKETS=${GRAFANA_READ_BUCKETS:-captaciones_julio,captaciones_tiemporeal,contexto_madrid}
      - NODERED_WRITE_BUCKETS=${NODERED_WRITE_BUCKETS:-captaciones_tiemporeal,contexto_madrid}
      - LOADER_WRITE_BUCKETS=${LOADER_WRITE_BUCKETS:-captaciones_julio}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: "no"
    networks:
      - aeroadd

networks:
  aeroadd:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data:
  nodered-data:
  mcp-secrets:
